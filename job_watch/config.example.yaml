# Copiez ce fichier en "config.yaml" (dans le même dossier) puis
# personnalisez les valeurs ci-dessous. config.yaml n'est jamais commité
# (voir .gitignore) car il contient vos coordonnées personnelles.

candidat:
  nom: "Prénom Nom"
  email: "vous@example.com"
  telephone: ""
  cv_path: ""  # ex: "C:/Users/moi/Documents/CV.pdf" — optionnel, joint aux brouillons si renseigné

recherche:
  mots_cles: "développeur python"
  lieu: "Bruxelles"
  type_contrat: ""  # ex: "CDI" — laisser vide pour ne pas filtrer
  max_resultats_par_source: 20

sources:
  leforem:
    active: true
  indeed:
    active: true
    domaine: "fr.indeed.com"  # ou "be.indeed.com" pour la Belgique
  linkedin:
    active: true

# Sites additionnels, sans code dédié : il suffit de fournir l'URL de
# recherche et les sélecteurs CSS de la page de résultats. Le plus simple
# pour les remplir est de passer par l'interface graphique
# (python -m job_watch.gui), qui a un formulaire dédié. Exemple :
#
# sites_personnalises:
#   - nom: "MonSite"
#     active: true
#     url_recherche: "https://exemple.com/emplois?q={mots_cles}&l={lieu}"
#     base_url: "https://exemple.com"        # préfixe pour les liens relatifs
#     selecteur_carte: "div.job-card"        # une carte = une offre
#     selecteur_titre: "h2.title"
#     selecteur_entreprise: ".company"
#     selecteur_lieu: ".location"
#     selecteur_lien: "a"
sites_personnalises: []

dossier_brouillons: "job_watch/drafts"
fichier_suivi: "job_watch/seen_jobs.json"
